<style>
:root{--bg:#E6F0FB;--card:#fff;--ink:#1D2433;--mut:#66708C;--line:#DDE2F0;--pink:#EBAA9D;--pinkS:#F8DDD7;--blue:#9EC5F0;--blueS:#DCEAFA;--lav:#C9BDEB;--bad:#D9604C;--ok:#4C9A74;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131E30;--card:#1E2335;--ink:#EEF0F8;--mut:#98A1BF;--line:#2F3652;--pink:#B7695C;--pinkS:#3B2A2E;--blue:#5A8FC9;--blueS:#223048;--lav:#6F63A6;--bad:#EE7C68;--ok:#6CC49A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131E30;--card:#1E2335;--ink:#EEF0F8;--mut:#98A1BF;--line:#2F3652;--pink:#B7695C;--pinkS:#3B2A2E;--blue:#5A8FC9;--blueS:#223048;--lav:#6F63A6;--bad:#EE7C68;--ok:#6CC49A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 14px/1.4 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
main{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:20px;font-weight:800;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.lvl{font-size:12px;color:var(--mut);text-align:right}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px;transition:width .3s}
.bar.pk i{background:var(--pink)}.bar.bad i{background:var(--bad)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;padding:10px 4px;border:0;border-radius:10px;background:var(--card);color:var(--mut);font:700 14px Montserrat,system-ui,sans-serif;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mon b{font-size:17px;font-weight:800;background:var(--pink);color:#1D2433;padding:6px 14px;border-radius:8px}
.mon button{width:38px;height:38px;border:0;border-radius:10px;background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.big{font-size:26px;font-weight:800}
.sub{color:var(--mut);font-size:12px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%}
.hg th,.hg td{padding:3px;text-align:center;font-size:11px;font-weight:700;color:var(--mut)}
.hg th b{display:block;color:var(--ink);font-size:12px}
.hg .we{background:var(--blueS);border-radius:6px}
.nm{position:sticky;left:0;background:var(--card);text-align:left!important;min-width:140px;max-width:140px;font-size:13px!important;color:var(--ink)!important;padding-right:6px!important;z-index:1}
.nm .x{border:0;background:none;color:var(--mut);font:700 18px Montserrat,system-ui,sans-serif;min-width:32px;min-height:32px;cursor:pointer;float:right}.nm .x.sure{background:var(--bad);color:#fff;border-radius:8px;font-size:11px;padding:0 8px}
.cb{width:24px;height:24px;border:2px solid var(--ink);border-radius:6px;background:none;cursor:pointer;padding:0;position:relative}
.cb.on{background:var(--ink)}
.cb.on::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.pc{min-width:42px;color:var(--ink)!important}
.ft td{padding-top:8px}
.ft .ok{color:var(--ok)}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
input,select{font:500 14px Montserrat,system-ui,sans-serif;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
input[type=text]{flex:1 1 160px}
.btn{border:0;border-radius:10px;background:var(--blue);color:#1D2433;font:800 14px Montserrat,system-ui,sans-serif;padding:10px 16px;cursor:pointer}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task.done .tt{text-decoration:line-through;color:var(--mut)}
.tt{font-weight:700}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:11px;color:var(--mut);align-items:center}
.pill{padding:2px 9px;border-radius:20px;font-weight:700;color:#1D2433}
.p0{background:#D8DAE2}.p1{background:var(--blue)}.p2{background:var(--lav)}.p3{background:var(--pink)}
.late{color:var(--bad);font-weight:700}
.rm{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer}
.bg{width:100%}
.bg th{font-size:12px;color:var(--mut);text-align:left;padding:4px}
.bg td{padding:6px 4px;vertical-align:middle}
.bg input{width:100%;text-align:right}
.bg .c{font-weight:700}
.left{display:flex;justify-content:space-between;gap:10px;margin-top:6px;padding:12px;border-radius:10px;background:var(--blueS);font-weight:800}
.empty{color:var(--mut);padding:10px 0}
.wk{background:var(--pinkS);border-radius:6px;color:var(--ink)!important}
.off{display:block;width:24px;height:24px;margin:auto;border-radius:6px;background:repeating-linear-gradient(45deg,var(--line),var(--line) 3px,transparent 3px,transparent 6px)}
.hp{padding:10px 0;border-top:1px solid var(--line)}
.hpt{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.hpt span{color:var(--mut);font-size:12px;white-space:nowrap}
.chips{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--mut);border-radius:8px;padding:5px 9px;font:700 12px Montserrat,system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

body{background:var(--bgb,linear-gradient(180deg,var(--bg),var(--blueS))) fixed}
:root[data-anim=off] *{animation:none!important;transition:none!important}
h1{font-size:24px;letter-spacing:-.02em}
.lvl{display:flex;align-items:center;gap:10px;text-align:left;font-weight:700;color:var(--ink)}
.badge{width:40px;height:40px;border-radius:12px;background:var(--pink);color:#1D2433;display:grid;place-items:center;font-size:18px;font-weight:800}
.bar{height:12px}
.tabs{background:var(--card);padding:5px;border-radius:16px;border:1px solid var(--line)}
.tabs button{background:none;border-radius:12px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.card{border:1px solid var(--line);border-radius:var(--r,20px);padding:16px;box-shadow:0 14px 28px -22px rgba(40,50,100,.45)}
.hero{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.rb{stroke:var(--line)}.rf{stroke:var(--pink);transition:stroke-dasharray .5s}
.pctbig{margin-left:auto;font-size:32px;font-weight:800;letter-spacing:-.02em}
.mon b{background:var(--pink);color:#1D2433;border-radius:12px;padding:8px 18px}
.mon button{border:1px solid var(--line);border-radius:12px}
.cb{border-color:var(--mut);border-radius:7px}
.cb.on{background:var(--blue);border-color:var(--blue)}
.cb.on::after{border-color:#10162A}
.pop{animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i,.rf{transition:none}}
.tdh{background:var(--pink)!important;border-radius:8px!important;color:#1D2433!important}.tdh b{color:#1D2433!important}
.tdc{background:var(--pinkS)}
.wk{font-size:11px!important}
.hp{padding:12px 0}
.hp:last-child{padding-bottom:0}
.btn{border-radius:12px;box-shadow:0 8px 16px -10px var(--blue)}
.btn.sm{padding:7px 14px;font-size:12px}
.task{display:grid;background:var(--bg);border:1px solid var(--line);border-left:5px solid #B9BFD0;border-radius:14px;padding:10px 12px;margin-top:8px}
.task.q1{border-left-color:var(--blue)}.task.q2{border-left-color:var(--lav)}.task.q3{border-left-color:var(--pink)}
.task.done{opacity:.55}
.left{border-radius:14px;font-size:16px}
.left.neg{background:var(--pinkS);color:var(--bad)}
.bg input{border-radius:10px}
.tabs button{font-size:13px}
.mh{display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px}
.fi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.fi span:last-child{color:var(--mut);white-space:nowrap}
.fa{display:flex;gap:6px;margin-top:8px}
.fa input[type=text]{flex:1 1 120px}
.fa input[type=number]{width:84px;flex:none}
.fa .btn{padding:9px 16px;flex:none}
.gls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.gl{width:34px;height:44px;border:2px solid var(--blue);border-radius:6px 6px 12px 12px;background:none;cursor:pointer;padding:0}
.gl.on{background:var(--blue)}
.wch{display:flex;gap:8px;align-items:flex-end;height:112px;margin-top:10px}
.wb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border:0;background:none;cursor:pointer;padding:0;color:var(--mut);font:700 11px Montserrat,system-ui,sans-serif}
.wb i{display:block;width:100%;background:var(--blueS);border-radius:8px 8px 4px 4px}
.wb.on{color:var(--ink)}.wb.on i{background:var(--pink)}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:1 0 auto;padding:10px 12px}
.bn{background:var(--pink);color:#1D2433;border-radius:14px;padding:10px 14px;margin-bottom:10px;font-weight:700}
.bdr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.bdr:first-child{border-top:0}
.bdr.today{background:var(--pinkS);border-radius:12px;padding:10px}
.hg th span{display:block;font-size:11px}
main{zoom:var(--z,1)}
.gear{width:40px;height:40px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--card)}.sw.on{border-color:var(--ink)}
.ico{width:72px;height:72px;border-radius:16px;object-fit:cover;flex:none;border:1px solid var(--line)}
label.btn{display:inline-block}
.whl{position:relative;width:220px;max-width:100%;aspect-ratio:1;margin:12px auto;touch-action:none;cursor:pointer}
.ringc{position:absolute;inset:0;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);-webkit-mask:radial-gradient(circle closest-side,transparent 70%,#000 71%);mask:radial-gradient(circle closest-side,transparent 70%,#000 71%)}
.knob{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);pointer-events:none}
.rng{width:100%;padding:0;border:0;background:none;accent-color:var(--pink)}
.pal{width:64px;height:40px;border:1px solid var(--line);border-radius:12px;padding:2px;background:var(--card);cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="ttl">Жизнь как игра</h1>
    <div style="display:flex;align-items:center;gap:10px"><div class="lvl" id="lvl"></div><button class="gear" id="gear" onclick="go('s')" aria-label="Настройки">⚙</button></div>
  </div>
  <div class="bar pk" aria-hidden="true"><i id="xp"></i></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="bnr"></div><div id="view"></div>
</main>
<script>
var MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
var PR=['Низкий','Средний','Высокий','Срочно'];
var CATS=['Работа','Учёба','Личное'];
var BC=['Доход','Подписки','Регулярные платежи','Траты','Накопления','Долги'];
function p(n){return n<10?'0'+n:''+n}
function ym(d){return d.getFullYear()+'-'+p(d.getMonth()+1)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var S=null;
try{S=JSON.parse(localStorage.getItem('lifegame1'))}catch(e){}
if(!S||!S.habits){S={habits:[{id:1,n:'Работа над проектом'},{id:2,n:'Прогулка 40 минут'},{id:3,n:'План на день'}],checks:{},tasks:[],budget:{},tab:'h',m:ym(new Date())}}
function save(){try{localStorage.setItem('lifegame1',JSON.stringify(S))}catch(e){}}
function go(t){S.tab=t;save();render()}
function mv(n){var a=S.m.split('-').map(Number),d=new Date(a[0],a[1]-1+n,1);S.m=ym(d);save();render()}
var lastK=null;function goT(){S.m=ym(new Date());save();render()}
function tg(k){lastK=k;if(S.vib=='on'&&navigator.vibrate)navigator.vibrate(12);if(S.checks[k])delete S.checks[k];else S.checks[k]=1;save();render()}
function addH(){var i=document.getElementById('hn'),v=i.value.trim();if(!v)return;S.habits.push({id:Date.now(),n:v});save();render()}
var pend=null;
function rmH(id){if(pend!==id){pend=id;render();setTimeout(function(){if(pend===id){pend=null;render()}},3000);return}pend=null;S.habits=S.habits.filter(function(h){return h.id!==id});save();render()}
function addT(){var t=document.getElementById('tt').value.trim();if(!t)return;
  S.tasks.push({id:Date.now(),t:t,due:document.getElementById('td').value,pr:+document.getElementById('tp').value,cat:document.getElementById('tc').value,done:false});save();render()}
function dn(id){S.tasks.forEach(function(x){if(x.id===id)x.done=!x.done});save();render()}
function rmT(id){S.tasks=S.tasks.filter(function(x){return x.id!==id});save();render()}
function bv(c,i,v){var b=S.budget[S.m]=S.budget[S.m]||{};var r=b[c]=b[c]||[0,0];r[i]=parseFloat(v)||0;save();render()}
function fmt(n){return Math.round(n).toLocaleString(L=='en'?'en-US':L=='pl'?'pl-PL':'ru-RU')}

function xpInfo(){var n=Object.keys(S.checks).length+S.tasks.filter(function(t){return t.done}).length*3;return{xp:n,lv:Math.floor(n/50)+1,part:n%50}}

var ALLD=[0,1,2,3,4,5,6],ORD=[1,2,3,4,5,6,0];
function wd(id,i){S.habits.forEach(function(h){if(h.id!==id)return;var a=(h.days||ALLD).slice(),k=a.indexOf(i);if(k>-1){if(a.length>1)a.splice(k,1)}else a.push(i);h.days=a});save();render()}
function habitsView(){
  var a=S.m.split('-').map(Number),y=a[0],m=a[1],N=new Date(y,m,0).getDate(),done=0,tot=0,per=[],act=[],stats=[],now=new Date(),tdn=(ym(now)===S.m)?now.getDate():0;
  for(var d=0;d<=N;d++){per.push(0);act.push(0)}
  var off=(new Date(y,m-1,1).getDay()+6)%7,wc=[];
  for(var d=1;d<=N;d++){var w=Math.floor((d-1+off)/7);wc[w]=(wc[w]||0)+1}
  var wk='<tr><th class="nm"></th>'+wc.map(function(n,i){return '<th colspan="'+n+'" class="wk">Неделя '+(i+1)+'</th>'}).join('')+'<th></th></tr>';
  var head='<tr><th class="nm"></th>';
  for(var d=1;d<=N;d++){var w=new Date(y,m-1,d).getDay();head+='<th class="'+((w==0||w==6)?'we':'')+(d===tdn?' tdh':'')+'">'+WD[w]+'<b>'+d+'</b>'+(bdAt(m,d)?'<span title="День рождения: '+bdAt(m,d)+'">🎂</span>':'')+'</th>'}
  head+='<th>%</th></tr>';
  var rows=S.habits.map(function(h){
    var c=0,n=0,cells='',ds=h.days||ALLD;
    for(var d=1;d<=N;d++){
      if(ds.indexOf(new Date(y,m-1,d).getDay())<0){cells+='<td><span class="off"></span></td>';continue}
      var k=h.id+'|'+S.m+'-'+p(d),on=S.checks[k];n++;act[d]++;if(on){c++;per[d]++}
      cells+='<td class="'+(d===tdn?'tdc':'')+'"><button class="cb '+(on?'on':'')+(k===lastK?' pop':'')+'" onclick="tg(\''+k+'\')" aria-label="'+esc(h.n)+', '+d+'"></button></td>'}
    var q=n?Math.round(c/n*100):0;var sk=0;for(var e=(tdn||N);e>=1;e--){if(ds.indexOf(new Date(y,m-1,e).getDay())<0)continue;if(S.checks[h.id+'|'+S.m+'-'+p(e)])sk++;else if(e!==tdn)break}done+=c;tot+=n;stats.push({h:h,c:c,n:n,q:q,sk:sk});
    return '<tr><th class="nm">'+esc(h.n)+'<button class="x'+(pend===h.id?' sure':'')+'" onclick="rmH('+h.id+')" aria-label="Удалить привычку">'+(pend===h.id?'Удалить?':'×')+'</button></th>'+cells+'<td class="pc">'+q+'%</td></tr>'}).join('');
  var foot='<tr class="ft"><th class="nm">Выполнено за день</th>';
  for(var d=1;d<=N;d++){var q=act[d]?Math.round(per[d]/act[d]*100):0;foot+='<td class="'+(act[d]&&q==100?'ok':'')+'">'+(act[d]?q:'–')+'</td>'}
  foot+='<td></td></tr>';
  var pct=tot?Math.round(done/tot*100):0;
  var panel=stats.map(function(s){return '<div class="hp"><div class="hpt"><b>'+esc(s.h.n)+'</b><span>'+(s.sk>1?'🔥 '+s.sk+' · ':'')+s.c+' / '+s.n+' · '+s.q+'%</span></div><div class="bar '+(s.q>=90?'':'pk')+'"><i style="width:'+s.q+'%"></i></div><div class="chips">'+ORD.map(function(i){return '<button class="chip'+((s.h.days||ALLD).indexOf(i)>-1?' on':'')+'" onclick="wd('+s.h.id+','+i+')">'+WD[i]+'</button>'}).join('')+'</div></div>'}).join('');
  return mon()+'<div class="card hero"><svg class="ring" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" class="rb"/><circle cx="40" cy="40" r="34" class="rf" stroke-dasharray="'+(pct*2.136)+' 214"/></svg><div><div class="sub">Прогресс за месяц</div><div class="big">'+done+' / '+tot+'</div><div class="sub">'+(pct>=90?'Отличный месяц!':pct>=60?'Хороший темп':pct>0?'Продолжай, всё впереди':'Отметь первую привычку')+'</div></div><div class="pctbig">'+pct+'%</div></div>'+
  '<div class="card"><div class="add" style="margin:0 0 12px"><input type="text" id="hn" placeholder="Новая привычка, например «Не есть сладкое»" maxlength="60" onkeydown="if(event.key===\'Enter\')addH()"><button class="btn" onclick="addH()">+ Добавить привычку</button></div><div class="scroll"><table class="hg">'+wk+head+rows+foot+'</table></div></div>'+
  '<div class="card"><div class="sub" style="margin-bottom:6px">Процент по каждой привычке. Выбери дни недели, в которые она нужна: остальные дни не считаются.</div>'+(panel||'<div class="empty">Добавьте первую привычку.</div>')+'</div>'}

var MEALS=['Завтрак','Обед','Ужин','Перекус'],MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function iso(d){return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function fday(){return S.fd||iso(new Date())}
function fget(k){return (S.food&&S.food[k])||{items:[],water:0}}
function fset(k){S.food=S.food||{};return S.food[k]||(S.food[k]={items:[],water:0})}
function fgo(k){S.fd=k;save();render()}
function fmv(n){var d=new Date(fday()+'T00:00:00');d.setDate(d.getDate()+n);fgo(iso(d))}
function addF(m){var n=document.getElementById('fn'+m),c=document.getElementById('fk'+m),v=n.value.trim();if(!v)return;fset(fday()).items.push({id:Date.now(),m:m,n:v,k:parseFloat(c.value)||0});save();render()}
function rmF(id){var d=fset(fday());d.items=d.items.filter(function(x){return x.id!==id});save();render()}
function wset(n){var d=fset(fday());d.water=(d.water===n)?n-1:n;save();render()}
function setGoal(v){S.goal=parseFloat(v)||0;save();render()}
function foodView(){
  var k=fday(),dt=new Date(k+'T00:00:00'),D=fget(k),tot=0,g=S.goal||0;
  D.items.forEach(function(x){tot+=x.k});
  var pct=g?Math.min(100,Math.round(tot/g*100)):0;
  var nav='<div class="mon"><button onclick="fmv(-1)" aria-label="Предыдущий день">‹</button><b>'+dt.getDate()+' '+MG[dt.getMonth()]+', '+WD[dt.getDay()]+'</b><button onclick="fmv(1)" aria-label="Следующий день">›</button></div>'+(k!==iso(new Date())?'<div style="text-align:center;margin:-2px 0 10px"><button class="btn sm" onclick="fgo(\''+iso(new Date())+'\')">К сегодняшнему дню</button></div>':'');
  var sum='<div class="card"><div class="sub">Съедено за день</div><div class="big">'+fmt(tot)+' ккал'+(g?' <span class="sub">из '+fmt(g)+'</span>':'')+'</div>'+(g?'<div class="bar pk" style="margin:8px 0 4px"><i style="width:'+pct+'%"></i></div><div class="sub">'+(tot<=g?'Осталось '+fmt(g-tot)+' ккал':'Больше цели на '+fmt(tot-g)+' ккал')+'</div>':'')+
   '<div class="add" style="margin-top:10px"><input type="number" inputmode="numeric" value="'+(g||'')+'" placeholder="Своя цель на день, ккал (необязательно)" onchange="setGoal(this.value)" aria-label="Цель по калориям" style="flex:1 1 200px"></div></div>';
  var gl='';for(var i=1;i<=8;i++)gl+='<button class="gl'+(i<=D.water?' on':'')+'" onclick="wset('+i+')" aria-label="Стаканов воды: '+i+'"></button>';
  var water='<div class="card"><div class="hpt"><b>Вода</b><span>'+D.water+' / 8 стаканов</span></div><div class="gls">'+gl+'</div></div>';
  var meals=MEALS.map(function(nm,m){
    var its=D.items.filter(function(x){return x.m===m}),s=0;its.forEach(function(x){s+=x.k});
    return '<div class="card"><div class="mh"><span>'+nm+'</span><span class="sub">'+fmt(s)+' ккал</span></div>'+
    its.map(function(x){return '<div class="fi"><span>'+esc(x.n)+'</span><span>'+(x.k?fmt(x.k)+' ккал':'')+'<button class="rm" onclick="rmF('+x.id+')" aria-label="Удалить">×</button></span></div>'}).join('')+
    '<div class="fa"><input type="text" id="fn'+m+'" placeholder="Что съели" maxlength="60" onkeydown="if(event.key===\'Enter\')addF('+m+')"><input type="number" inputmode="numeric" id="fk'+m+'" placeholder="ккал" aria-label="Калории"><button class="btn" onclick="addF('+m+')" aria-label="Добавить">+</button></div></div>'}).join('');
  var arr=[],mx=g||1;
  for(var i=6;i>=0;i--){var d2=new Date(dt);d2.setDate(d2.getDate()-i);var kk=iso(d2),t=0;fget(kk).items.forEach(function(x){t+=x.k});arr.push({k:kk,t:t,w:WD[d2.getDay()]});if(t>mx)mx=t}
  var wk='<div class="card"><div class="sub">Калории за 7 дней, нажми на день, чтобы открыть</div><div class="wch">'+arr.map(function(a){return '<button class="wb'+(a.k===k?' on':'')+'" onclick="fgo(\''+a.k+'\')" aria-label="'+a.w+', '+fmt(a.t)+' ккал"><i style="height:'+Math.max(4,Math.round(a.t/mx*80))+'px"></i><span>'+a.w+'</span></button>'}).join('')+'</div></div>';
  return nav+sum+water+meals+wk}

function fmtT(m){m=Math.round(m);var h=Math.floor(m/60),r=m%60;return h?h+' ч'+(r?' '+r+' мин':''):r+' мин'}
function sget(k){return (S.scr&&S.scr[k])||[]}
function ssum(a){var t=0;a.forEach(function(x){t+=x.m});return t}
function addS(){var n=document.getElementById('sn'),c=document.getElementById('sm'),v=n.value.trim(),m=parseFloat(c.value);if(!v||!(m>0))return;S.scr=S.scr||{};var k=fday();(S.scr[k]=S.scr[k]||[]).push({id:Date.now(),n:v,m:m});save();render()}
function rmS(id){var k=fday();S.scr[k]=sget(k).filter(function(x){return x.id!==id});save();render()}
function setLim(v){S.lim=parseFloat(v)||0;save();render()}
function phoneView(){
  var k=fday(),dt=new Date(k+'T00:00:00'),L=sget(k).slice().sort(function(a,b){return b.m-a.m}),tot=ssum(L),g=S.lim||0,pct=g?Math.min(100,Math.round(tot/g*100)):0;
  var nav='<div class="mon"><button onclick="fmv(-1)" aria-label="Предыдущий день">‹</button><b>'+dt.getDate()+' '+MG[dt.getMonth()]+', '+WD[dt.getDay()]+'</b><button onclick="fmv(1)" aria-label="Следующий день">›</button></div>'+(k!==iso(new Date())?'<div style="text-align:center;margin:-2px 0 10px"><button class="btn sm" onclick="fgo(\''+iso(new Date())+'\')">К сегодняшнему дню</button></div>':'');
  var arr=[],mx=g||1,wt=0,wn=0;
  for(var i=6;i>=0;i--){var d2=new Date(dt);d2.setDate(d2.getDate()-i);var kk=iso(d2),t=ssum(sget(kk));arr.push({k:kk,t:t,w:WD[d2.getDay()]});if(t>mx)mx=t;if(t>0){wt+=t;wn++}}
  var sumC='<div class="card"><div class="sub">Время в телефоне за день</div><div class="big">'+fmtT(tot)+(g?' <span class="sub">из '+fmtT(g)+'</span>':'')+'</div>'+(g?'<div class="bar '+(tot>g?'bad':'')+'" style="margin:8px 0 4px"><i style="width:'+pct+'%"></i></div><div class="sub">'+(tot<=g?'Осталось '+fmtT(g-tot):'Больше лимита на '+fmtT(tot-g))+'</div>':'')+
   '<div class="add" style="margin-top:10px"><input type="number" inputmode="numeric" value="'+(g||'')+'" placeholder="Свой лимит на день, минут (необязательно)" onchange="setLim(this.value)" aria-label="Лимит в минутах" style="flex:1 1 200px"></div></div>';
  var top=L.length?L[0].m:1;
  var apps='<div class="card"><div class="mh"><span>По приложениям</span></div>'+(L.length?L.map(function(x){return '<div class="fi" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><span>'+esc(x.n)+'</span><span style="color:var(--mut);white-space:nowrap">'+fmtT(x.m)+'<button class="rm" onclick="rmS('+x.id+')" aria-label="Удалить">×</button></span></div><div class="bar" style="height:6px;margin-top:4px"><i style="width:'+Math.round(x.m/top*100)+'%"></i></div></div>'}).join(''):'<div class="empty">Пока пусто. Загляни в экранное время на телефоне и впиши сюда главные приложения.</div>')+

function bdNext(b){var t=new Date();t.setHours(0,0,0,0);var d=new Date(t.getFullYear(),b.m-1,b.d);if(d<t)d=new Date(t.getFullYear()+1,b.m-1,b.d);return{days:Math.round((d-t)/864e5),yr:d.getFullYear()}}
function bdAt(m,d){return (S.bd||[]).filter(function(b){return b.m===m&&b.d===d}).map(function(b){return esc(b.n)}).join(', ')}
function addB(){var n=document.getElementById('bnm').value.trim(),d=parseInt(document.getElementById('bdd').value),m=parseInt(document.getElementById('bmm').value),y=parseInt(document.getElementById('byy').value);
  if(!n||!(d>=1&&d<=31)||new Date(2000,m-1,d).getMonth()!==m-1)return;S.bd=S.bd||[];S.bd.push({id:Date.now(),n:n,d:d,m:m,y:(y>1900&&y<=new Date().getFullYear())?y:0});save();render()}
function rmB(id){S.bd=(S.bd||[]).filter(function(b){return b.id!==id});save();render()}
function bdBanner(){
  var L=(S.bd||[]).map(function(b){return{b:b,n:bdNext(b).days}}).filter(function(x){return x.n<=7}).sort(function(a,b){return a.n-b.n}).slice(0,3);
  return L.map(function(x){return '<div class="bn">🎂 '+(x.n===0?'Сегодня день рождения: ':x.n===1?'Завтра день рождения: ':'Через '+x.n+' дн. день рождения: ')+esc(x.b.n)+'</div>'}).join('')}
function bdView(){
  var L=(S.bd||[]).map(function(b){var x=bdNext(b);return{b:b,n:x.days,age:b.y?x.yr-b.y:0}}).sort(function(a,b){return a.n-b.n});
  var form='<div class="card"><div class="add" style="margin:0"><input type="text" id="bnm" placeholder="Чей день рождения" maxlength="40" style="flex:1 1 100%" onkeydown="if(event.key===\'Enter\')addB()">'+
   '<input type="number" inputmode="numeric" id="bdd" placeholder="День" min="1" max="31" style="width:80px" aria-label="День">'+
   '<select id="bmm" aria-label="Месяц">'+MN.map(function(x,i){return '<option value="'+(i+1)+'">'+x+'</option>'}).join('')+'</select>'+
   '<input type="number" inputmode="numeric" id="byy" placeholder="Год (необязательно)" style="flex:1 1 130px" aria-label="Год рождения">'+
   '<button class="btn" onclick="addB()">+ Добавить</button></div></div>';
  var list='<div class="card">'+(L.length?L.map(function(x){var b=x.b;return '<div class="bdr'+(x.n===0?' today':'')+'"><div><div class="tt">'+esc(b.n)+'</div><div class="meta"><span>'+b.d+' '+MG[b.m-1]+'</span>'+(x.age?'<span>исполнится '+x.age+'</span>':'')+'</div></div><div style="display:flex;align-items:center;gap:6px"><span class="pill '+(x.n<=7?'p3':'p1')+'">'+(x.n===0?'Сегодня 🎂':'через '+x.n+' дн.')+'</span><button class="rm" onclick="rmB('+b.id+')" aria-label="Удалить">×</button></div></div>'}).join(''):'<div class="empty">Пока никого нет. Добавь первый день рождения выше, и он появится в календаре привычек с отметкой 🎂.</div>')+'</div>';
  return form+list}

function mon(){var a=S.m.split('-').map(Number);
  return '<div class="mon"><button onclick="mv(-1)" aria-label="Прошлый месяц">‹</button><b>'+MN[a[1]-1]+' '+a[0]+'</b><button onclick="mv(1)" aria-label="Следующий месяц">›</button></div>'+(S.m!==ym(new Date())?'<div style="text-align:center;margin:-2px 0 10px"><button class="btn sm" onclick="goT()">К текущему месяцу</button></div>':'')}

function tasksView(){
  var today=new Date();today.setHours(0,0,0,0);
  var list=S.tasks.slice().sort(function(a,b){if(a.done!=b.done)return a.done?1:-1;return (a.due||'9')<(b.due||'9')?-1:1});
  var items=list.map(function(t){
    var dl='';
    if(t.due){var n=Math.round((new Date(t.due+'T00:00:00')-today)/864e5);
      dl=n<0&&!t.done?'<span class="late">просрочено на '+(-n)+' дн.</span>':'<span>'+t.due.split('-').reverse().join('.')+' · осталось '+n+' дн.</span>'}
    return '<div class="task q'+t.pr+(t.done?' done':'')+'"><button class="cb '+(t.done?'on':'')+'" onclick="dn('+t.id+')" aria-label="Выполнено"></button>'+
    '<div><div class="tt">'+esc(t.t)+'</div><div class="meta"><span class="pill p'+t.pr+'">'+PR[t.pr]+'</span><span>'+esc(t.cat)+'</span>'+dl+'</div></div>'+
    '<button class="rm" onclick="rmT('+t.id+')" aria-label="Удалить задачу">×</button></div>'}).join('');
  var dn=S.tasks.filter(function(t){return t.done}).length;
  return '<div class="card"><div class="sub">Выполнено задач</div><div class="big">'+dn+' / '+S.tasks.length+'</div></div>'+
  '<div class="card"><div class="add" style="margin:0 0 6px"><input type="text" id="tt" placeholder="Новая задача" maxlength="80"><input type="date" id="td" aria-label="Срок">'+
  '<select id="tp" aria-label="Приоритет">'+PR.map(function(x,i){return '<option value="'+i+'"'+(i==1?' selected':'')+'>'+x+'</option>'}).join('')+'</select>'+
  '<select id="tc" aria-label="Категория">'+CATS.map(function(x){return '<option value="'+x+'">'+x+'</option>'}).join('')+'</select>'+
  '<button class="btn" onclick="addT()">Добавить задачу</button></div>'+(items||'<div class="empty">Задач пока нет. Добавьте первую выше.</div>')+'</div>'}

function budgetView(){
  var b=S.budget[S.m]||{};
  function g(c,i){return (b[c]&&b[c][i])||0}
  var rows=BC.map(function(c,k){
    var bd=g(c,0),f=g(c,1),over=k>0&&k!=4&&bd>0&&f>bd,w=bd?Math.min(100,Math.round(f/bd*100)):0;
    return '<tr><td class="c">'+c+'</td><td><input type="number" inputmode="decimal" value="'+(bd||'')+'" placeholder="0" onchange="bv(\''+c+'\',0,this.value)" aria-label="'+c+', бюджет"></td>'+
    '<td><input type="number" inputmode="decimal" value="'+(f||'')+'" placeholder="0" onchange="bv(\''+c+'\',1,this.value)" aria-label="'+c+', факт"></td></tr>'+
    '<tr><td colspan="3" style="padding-top:0"><div class="bar '+(over?'bad':'')+'"><i style="width:'+w+'%"></i></div></td></tr>'}).join('');
  var lb=g('Доход',0),lf=g('Доход',1);
  for(var i=1;i<BC.length;i++){lb-=g(BC[i],0);lf-=g(BC[i],1)}
  return mon()+'<div class="card"><table class="bg"><tr><th>Категория</th><th>Бюджет, ₽</th><th>Факт, ₽</th></tr>'+rows+'</table>'+
  '<div class="left'+(lf<0?' neg':'')+'"><span>Осталось</span><span>'+fmt(lb)+' / '+fmt(lf)+' ₽</span></div>'+
  '<div class="sub" style="margin-top:8px">Полоса показывает, какую часть бюджета уже потрачено. Красная — перерасход.</div></div>'}
